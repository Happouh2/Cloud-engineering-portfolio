# CI pipeline for the items API in docker-application-platform/.
# On every pull request to main: lint, unit tests, package audit, build the image,
# scan it, start the whole stack and knock on /health. Costs $0 (public repo, GitHub's runners).
name: items-api CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "docker-application-platform/**"
      - ".github/workflows/items-api-ci.yml"
  workflow_dispatch:

# Least privilege: this pipeline may read the code and nothing else.
permissions:
  contents: read

# A newer push to the same branch cancels the older run that's still going.
concurrency:
  group: items-api-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: docker-application-platform

jobs:
  changes:
    name: Did the app change?
    runs-on: ubuntu-24.04
    outputs:
      app: ${{ steps.check.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Look for changes in the app folder or this file
        id: check
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE...$HEAD" | grep -qE '^(docker-application-platform/|\.github/workflows/items-api-ci\.yml$)'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  lint-test:
    name: Lint, test, audit
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            docker-application-platform/app/requirements.txt
            docker-application-platform/requirements-dev.txt
      - name: Install packages
        run: pip install -r app/requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Unit tests (pytest)
        run: pytest -v
      - name: Known-vulnerable packages (pip-audit)
        run: pip-audit -r app/requirements.txt --progress-spinner off

  build-scan:
    name: Build, scan, smoke test
    needs: lint-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build -t items-api:1.0.0 app
      - name: Check it runs as a normal user, not root
        run: test "$(docker run --rm items-api:1.0.0 id -u)" = "10001"
      - name: Scan the image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: items-api:1.0.0
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          version: v0.70.0
      - name: Start the whole stack
        run: |
          cp .env.example .env
          docker compose up -d --no-build --wait --wait-timeout 120
      - name: Knock on the front door
        run: |
          curl -fsS localhost:8080/health
          curl -fsS -X POST localhost:8080/items -H "Content-Type: application/json" -d '{"name":"ci-check"}'
          curl -fsS localhost:8080/items | grep ci-check
      - name: Show the logs if anything failed
        if: failure()
        run: docker compose logs --tail 50
      - name: Clean up
        if: always()
        run: docker compose down -v

  ci-passed:
    name: ci-passed
    if: always()
    needs: [changes, lint-test, build-scan]
    runs-on: ubuntu-24.04
    steps:
      - name: Every job passed or was skipped
        working-directory: .
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          case "$RESULTS" in
            *failure*|*cancelled*) echo "a job failed, so this pull request can't merge"; exit 1 ;;
          esac
          echo "all good"
